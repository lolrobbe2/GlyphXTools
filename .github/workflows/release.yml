
name: GlyphXTools CI/CD

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: glyphxtools-deploy
  cancel-in-progress: false

jobs:
  # ==========================================
  # WEB BUILD
  # ==========================================
  build-web:
    name: Build Flutter Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release --base-href /GlyphXTools/ --no-tree-shake-icons

      - name: Upload Web Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  # ==========================================
  # WINDOWS BUILD
  # ==========================================
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Enable Windows
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Package Windows
        shell: pwsh
        run: |
          Compress-Archive `
            -Path build/windows/x64/runner/Release/* `
            -DestinationPath GlyphXTools-windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: GlyphXTools-windows-x64.zip

  # ==========================================
  # LINUX BUILD
  # ==========================================
  build-linux:
    name: Build Linux x64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Enable Linux
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Package Linux
        run: |
          cd build/linux/x64/release/bundle
          tar -czf "$GITHUB_WORKSPACE/GlyphXTools-linux-x64.tar.gz" .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: GlyphXTools-linux-x64.tar.gz

  # ==========================================
  # DEPLOY WEB TO GITHUB PAGES
  # ==========================================
  deploy-web:
    name: Deploy GitHub Pages
    needs: build-web
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  # ==========================================
  # CREATE TIMESTAMPED GITHUB RELEASE
  # ==========================================
  release:
    name: Publish Release
    needs:
      - build-windows
      - build-linux

    runs-on: ubuntu-latest

    steps:
      - name: Generate UTC timestamp
        id: timestamp
        run: |
          echo "value=$(date -u +'%Y%m%d-%H%M%S')" >> "$GITHUB_OUTPUT"

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-build

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-build

      - name: Rename release assets
        run: |
          mv GlyphXTools-windows-x64.zip \
            GlyphXTools-windows-x64-${{ steps.timestamp.outputs.value }}.zip

          mv GlyphXTools-linux-x64.tar.gz \
            GlyphXTools-linux-x64-${{ steps.timestamp.outputs.value }}.tar.gz

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TIMESTAMP: ${{ steps.timestamp.outputs.value }}
          COMMIT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh release create "v${TIMESTAMP}" \
            "GlyphXTools-windows-x64-${TIMESTAMP}.zip" \
            "GlyphXTools-linux-x64-${TIMESTAMP}.tar.gz" \
            --repo "${REPOSITORY}" \
            --title "GlyphXTools ${TIMESTAMP}" \
            --notes "Automated release.

          Build timestamp: ${TIMESTAMP} UTC
          Commit: ${COMMIT_SHA}" \
            --latest
